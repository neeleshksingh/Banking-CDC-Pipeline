name: CD

on:
  push:
    branches: [ main ]   # deploy only from main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Key-pair auth as the least-privilege CI user (snowflake/security_setup.sql).
    # Secrets: SNOWFLAKE_ACCOUNT, SNOWFLAKE_CI_USER, SNOWFLAKE_WAREHOUSE,
    # SNOWFLAKE_PRIVATE_KEY (full PEM of keys/snowflake_ci_key.p8).
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      # ------------------------
      # Checkout repo
      # ------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------
      # Python setup
      # ------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------
      # Install dbt
      # ------------------------
      - name: Install dbt Snowflake adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      # ------------------------
      # Snowflake private key -> temp file (outside the checkout, mode 600)
      # ------------------------
      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/snowflake_ci_key.p8"
          install -m 600 /dev/null "$key_path"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_path"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # ------------------------
      # Configure dbt profile (no secrets in the file: env_var only)
      # ------------------------
      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOL'
          banking_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                role: BANKING_CI_ROLE
                database: BANKING
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                schema: ANALYTICS
                threads: 4
          EOL

      # ------------------------
      # Deploy dbt project
      # ------------------------
      - name: dbt build (prod)
        run: |
          cd banking_dbt
          dbt deps
          dbt build  # models + SCD2 snapshots + tests, in dependency order

      - name: Remove Snowflake private key
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"
