name: CD

on:
  push:
    branches: [ main ]
    paths:
      - "banking_dbt/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

# One prod deploy at a time; a newer push waits instead of racing the running build.
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Key-pair auth as the least-privilege CI user (snowflake/security_setup.sql).
    # Secrets: SNOWFLAKE_ACCOUNT, SNOWFLAKE_CI_USER, SNOWFLAKE_WAREHOUSE,
    # SNOWFLAKE_PRIVATE_KEY (full PEM of keys/snowflake_ci_key.p8).
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same dbt versions as the Airflow image (docker/airflow.Dockerfile)
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.5 dbt-snowflake==1.12.1

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/snowflake_ci_key.p8"
          install -m 600 /dev/null "$key_path"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_path"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # No secrets in the file: values come from env_var()
      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOL'
          banking_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                role: BANKING_CI_ROLE
                database: BANKING
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                schema: ANALYTICS
                threads: 4
          EOL

      - name: dbt build (prod)
        working-directory: banking_dbt
        run: dbt build  # models + SCD2 snapshots + tests, in dependency order

      - name: Remove Snowflake private key
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"
