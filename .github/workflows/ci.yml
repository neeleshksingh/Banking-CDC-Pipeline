name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# No secrets and no services: lint, unit tests and dbt parse all run offline,
# so the workflow also passes for pull requests from forks.
jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            consumer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt dbt-snowflake==1.10.2

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest + coverage)
        run: pytest

      # dbt parse builds the manifest (refs, sources, tests, Jinja) without
      # opening a connection, so a placeholder profile is enough.
      - name: dbt parse (offline)
        run: |
          mkdir -p "$RUNNER_TEMP/dbt"
          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<'EOL'
          banking_dbt:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-offline
                user: ci-offline
                private_key_path: /nonexistent/ci.p8
                role: CI_OFFLINE
                database: BANKING
                warehouse: CI_OFFLINE
                schema: ANALYTICS
                threads: 1
          EOL
          cd banking_dbt
          dbt parse --profiles-dir "$RUNNER_TEMP/dbt" --no-partial-parse
          echo "dbt data tests: $(dbt ls --resource-type test --profiles-dir "$RUNNER_TEMP/dbt" --output name -q | wc -l)"
